# =============================================================================
# MkDocs Configuration — Todo Application Documentation
# =============================================================================
# Static site documentation generator configuration using MkDocs with the
# Material theme. Provides Mermaid diagram support, search, code highlighting,
# and a complete navigation tree for all documentation files.
#
# Build:   mkdocs build --strict
# Serve:   mkdocs serve --dev-addr 127.0.0.1:8000
# Deploy:  mkdocs gh-deploy --force
#
# Dependencies:
#   pip install mkdocs==1.6.1 mkdocs-material==9.7.2 pymdown-extensions==10.14.3 \
#              mkdocs-mermaid2-plugin==1.1.1 mkdocs-minify-plugin==0.8.0
#
# Source: AAP Sections 0.4.1, 0.5.4, 0.8.1, 0.9.3
# =============================================================================

# ---------------------------------------------------------------------------
# Site Configuration
# ---------------------------------------------------------------------------
site_name: Todo Application Documentation
site_description: >-
  Comprehensive documentation for the Todo Application — a full-stack,
  AI-powered to-do management platform built with Python/Flask, React,
  MongoDB, Auth0, and LangChain.
site_url: https://your-org.github.io/todo-app/
repo_url: https://github.com/your-org/todo-app
repo_name: your-org/todo-app

# ---------------------------------------------------------------------------
# Build Configuration
# ---------------------------------------------------------------------------
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

# ---------------------------------------------------------------------------
# Theme Configuration — Material for MkDocs
# ---------------------------------------------------------------------------
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search
  - mermaid2
  - minify:
      minify_html: true

# ---------------------------------------------------------------------------
# Markdown Extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# ---------------------------------------------------------------------------
# Navigation Tree
# ---------------------------------------------------------------------------
# All paths are relative to the docs_dir (docs/) directory.
# Each entry maps to a file under docs/ on disk.
# Example: getting-started/installation.md -> docs/getting-started/installation.md
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Quick Start: getting-started/quickstart.md
  - Guides:
      - Usage: guides/usage.md
      - Authentication: guides/authentication.md
      - AI Features: guides/ai-features.md
      - Docker Development: guides/docker-development.md
  - API Reference:
      - Overview: api-reference/overview.md
      - Todo Endpoints: api-reference/todos.md
      - User Endpoints: api-reference/users.md
      - Auth Endpoints: api-reference/auth.md
      - AI Endpoints: api-reference/ai.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Data Model: architecture/data-model.md
      - Security: architecture/security.md
  - Examples:
      - Python Client: examples/python-client.md
      - JavaScript Client: examples/javascript-client.md
      - cURL Examples: examples/curl-examples.md
  - Troubleshooting: troubleshooting.md
