# Docker Compose orchestration for the CALC Scientific Calculator project.
# Defines three services: frontend (React/Nginx), backend (Flask), and mongo (MongoDB 8.0).
# Usage: docker compose up --build
# Prerequisites: Copy .env.example to .env and fill in required values.

services:
  # Frontend service: React SPA built with Vite, served by Nginx.
  # Maps host port 3000 to Nginx container port 80.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - VITE_AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    networks:
      - calc-network
    restart: unless-stopped

  # Backend service: Flask API server with scientific calculator and history services.
  # Maps host port 5000 to container port 5000.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/calc}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - HISTORY_TTL_DAYS=${HISTORY_TTL_DAYS:-90}
    networks:
      - calc-network
    restart: unless-stopped

  # MongoDB service: Document database for calculation history persistence.
  # Uses the official MongoDB 8.0 image with a named volume for data durability.
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - calc-network
    restart: unless-stopped

# Named volumes for persistent data storage across container restarts.
volumes:
  mongo-data:
    driver: local

# Shared bridge network enabling inter-service communication by service name.
networks:
  calc-network:
    driver: bridge
