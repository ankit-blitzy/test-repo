# =============================================================================
# .markdownlint.yml — Markdown Linting Configuration
# Todo Application Documentation
# =============================================================================
#
# Enforces consistent Markdown formatting across all documentation files:
#   - README.md, CONTRIBUTING.md
#   - docs/**/*.md (getting-started, guides, api-reference, architecture, examples)
#
# Compatible with markdownlint-cli and markdownlint-cli2.
# Source: AAP Sections 0.5.4, 0.8.1, 0.9.2, 0.10
# =============================================================================

# -----------------------------------------------------------------------------
# Heading Rules
# -----------------------------------------------------------------------------

# MD001 - Heading levels should increment by one level at a time
# Prevents skipping heading levels (e.g., # -> ### without ##)
heading-increment: true

# MD003 - Heading style: ATX-style headings (#, ##, ###)
# Consistent with project documentation standards
heading-style:
  style: atx

# MD025 - Only one top-level heading (#) per document
# Each document should have exactly one H1 title
single-title-single-h1: true

# MD026 - No trailing punctuation in headings
# Keeps headings clean (e.g., "Installation" not "Installation:")
no-trailing-punctuation: true

# -----------------------------------------------------------------------------
# List Rules
# -----------------------------------------------------------------------------

# MD004 - Unordered list style: use dash (-) markers
# Consistent list markers across all documentation
ul-style:
  style: dash

# MD029 - Ordered list item prefix: sequential numbering
# Lists use 1. 2. 3. (not all 1. 1. 1.)
ol-prefix:
  style: ordered

# MD030 - Consistent spacing after list markers
# Ensures uniform spacing in all list items
list-marker-space: true

# MD032 - Blank lines around lists
# Improves readability and prevents rendering issues
blanks-around-lists: true

# -----------------------------------------------------------------------------
# Whitespace and Formatting Rules
# -----------------------------------------------------------------------------

# MD009 - No trailing whitespace on lines
no-trailing-spaces: true

# MD010 - No hard tab characters (use spaces)
no-hard-tabs: true

# MD012 - No multiple consecutive blank lines
no-multiple-blanks: true

# MD013 - Line length configuration
# Relaxed limits to accommodate documentation with wide tables, long URLs,
# Mermaid diagram syntax, and detailed API reference content
line-length:
  line_length: 300
  heading_line_length: 120
  code_block_line_length: 200
  code_blocks: false
  tables: false

# MD047 - Files should end with a single trailing newline
single-trailing-newline: true

# -----------------------------------------------------------------------------
# Code Block Rules
# -----------------------------------------------------------------------------

# MD031 - Blank lines around fenced code blocks
# Prevents rendering issues with adjacent content
blanks-around-fences: true

# MD040 - Require language specification for fenced code blocks
# CRITICAL: All code blocks must specify a language identifier
# (python, typescript, bash, json, yaml, mermaid, etc.)
# Per AAP Section 0.9.2: "All code blocks specify a language identifier"
fenced-code-language: true

# MD046 - Code block style: fenced (not indented)
# Fenced blocks support language identifiers and are more readable
code-block-style:
  style: fenced

# MD048 - Code fence style: backtick (not tilde)
# Consistent fence characters across all documentation
code-fence-style:
  style: backtick

# -----------------------------------------------------------------------------
# Link and URL Rules
# -----------------------------------------------------------------------------

# MD034 - No bare URLs; use Markdown link syntax
# Ensures all links are properly formatted: [text](url)
no-bare-urls: true

# -----------------------------------------------------------------------------
# Content Rules
# -----------------------------------------------------------------------------

# MD014 - Allow dollar signs in shell commands without requiring output
# Shell examples use $ prefix without needing to show command output
# Disabled to support copy-paste ready bash examples
commands-show-output: false

# MD024 - Allow duplicate headings in different sections
# API reference docs reuse headings like "Request", "Response", "Examples"
# across multiple endpoint sections
no-duplicate-heading:
  siblings_only: true

# MD033 - Allow inline HTML
# Required for: README badges (<img>), MkDocs admonitions, HTML attributes,
# and advanced formatting in documentation
no-inline-html: false

# MD036 - Allow emphasis as headings
# Provides flexibility in guides and tutorials where bold text serves as
# visual section markers without adding to the heading hierarchy
no-emphasis-as-heading: false

# MD041 - First line should be a top-level heading
# Every documentation file starts with a clear H1 title
first-line-heading: true
