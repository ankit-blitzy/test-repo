# Nginx configuration for the CALC Scientific Calculator SPA.
# Serves the production React/Vite build and proxies API requests to the Flask backend.
# This file is copied into the Nginx container at /etc/nginx/conf.d/default.conf
# by the frontend Dockerfile (multi-stage build).

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance — reduces transfer size for text-based assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers — applied to all responses for defense-in-depth.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing — fallback to index.html for client-side routing.
    # Any path that does not match a static file is served index.html,
    # allowing React Router (or equivalent) to handle navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — forward /api requests to the Flask backend service.
    # The hostname "backend" is resolved via the Docker Compose network (calc-network).
    # The backend service listens on port 5000 as defined in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static asset caching — Vite-generated assets include content hashes in filenames,
    # so long cache durations are safe (immutable). This dramatically reduces repeat
    # page-load times by allowing browsers to serve assets from the disk cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable access logging for the favicon to reduce log noise.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Disable access logging for robots.txt.
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
